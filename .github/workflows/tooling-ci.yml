name: OpenMUA2 tooling CI

on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "tests/**"
      - ".github/workflows/tooling-ci.yml"
  pull_request:
    paths:
      - "tools/**"
      - "tests/**"
      - ".github/workflows/tooling-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tooling tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee unittest.log

      - name: Annotate failing tests
        if: failure()
        shell: bash
        run: |
          [ -f unittest.log ] || exit 0
          grep -E "^(FAIL|ERROR):" unittest.log | head -30 | while IFS= read -r line; do echo "::error::$line"; done
          grep -E "^[A-Za-z]*(Error|Exception):" unittest.log | sort | uniq -c | head -10 | while IFS= read -r line; do echo "::error::$line"; done
