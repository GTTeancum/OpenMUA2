name: OpenMUA2 tooling CI

on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "tests/**"
      - ".github/workflows/tooling-ci.yml"
  pull_request:
    paths:
      - "tools/**"
      - "tests/**"
      - ".github/workflows/tooling-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tooling tests
        run: python -m unittest discover -s tests -v
