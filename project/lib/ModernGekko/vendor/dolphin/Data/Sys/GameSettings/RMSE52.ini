# Marvel: Ultimate Alliance 2 (USA)

[Core]
# OpenMUA2 reads extracted local data; do not simulate optical-drive seek delays.
# Preserve guest clocks and asynchronous completion, using buffered DVD transfers.
FastDiscSpeed = True
# OS scheduler wait loop polling the run queue bitmask. StaticRecomp can safely
# hand this loop to CoreTiming's idle skipper instead of burning host CPU.
StaticRecompIdlePC = 0x803F6858

